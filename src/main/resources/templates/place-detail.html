<!-- ==================== JAVASCRIPT ==================== -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ========== کوکی‌ها ==========
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    function deleteCookie(name) {
        document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    }

    // ========== متغیرها ==========
    const placeId = window.location.pathname.split('/').pop();
    const token = getCookie('token');
    let map = null;
    let currentSlide = 0;
    let isLiked = false;
    let likeCount = 0;

    // ========== مدیریت احراز هویت ==========
    const userLinks = document.getElementById('userLinks');
    const mobileUserLinks = document.getElementById('mobileUserLinks');
    const authButtons = document.getElementById('authButtons');
    const mobileAuthButtons = document.getElementById('mobileAuthButtons');
    const logoutBtn = document.getElementById('logoutBtn');
    const mobileLogoutBtn = document.getElementById('mobileLogoutBtn');

    if (token) {
        if (userLinks) userLinks.style.display = 'flex';
        if (mobileUserLinks) mobileUserLinks.style.display = 'block';
        if (authButtons) authButtons.style.display = 'none';
        if (mobileAuthButtons) mobileAuthButtons.style.display = 'none';
        if (logoutBtn) logoutBtn.style.display = 'inline-flex';
        if (mobileLogoutBtn) mobileLogoutBtn.style.display = 'block';
    }

    function handleLogout() {
        deleteCookie('token');
        deleteCookie('username');
        deleteCookie('role');
        window.location.href = '/';
    }

    logoutBtn?.addEventListener('click', handleLogout);
    mobileLogoutBtn?.addEventListener('click', handleLogout);

    // ========== منوی موبایل ==========
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    let menuOpen = false;

    hamburgerBtn?.addEventListener('click', () => {
        menuOpen = !menuOpen;
        mobileMenu.classList.toggle('hidden');
        hamburgerBtn.innerHTML = menuOpen ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
    });

    // ========== توابع کمکی ==========
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function displayStars(rating) {
        if (!rating || rating === 0) {
            return '<span class="stars-display">☆☆☆☆☆</span>';
        }
        const full = Math.floor(rating);
        const empty = 5 - full;
        let html = '<span class="stars-display">';
        html += '★'.repeat(full);
        html += '<span class="empty-star">' + '☆'.repeat(empty) + '</span>';
        html += '</span>';
        return html;
    }

    function formatDate(dateString) {
        if (!dateString) return '';
        try {
            const date = new Date(dateString);
            return date.toLocaleDateString('fa-IR', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        } catch {
            return dateString;
        }
    }

    // ========== گالری اسلایدر ==========
    function initGallery(images, containerId) {
        const container = document.getElementById(containerId);
        if (!images || images.length === 0) {
            container.innerHTML = `
                <div class="gallery-slider">
                    <div class="slides">
                        <div class="slide">
                            <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1A2A4A,#2A4A6A);">
                                <i class="fas fa-landmark" style="font-size:4rem;color:rgba(201,168,76,0.2);"></i>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            return;
        }

        let slidesHtml = images.map((url, index) => `
            <div class="slide">
                <img src="${url}" alt="تصویر ${index + 1}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=\\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1A2A4A,#2A4A6A);\\'><i class=\\'fas fa-image\\' style=\\'font-size:4rem;color:rgba(201,168,76,0.15);\\'></i></div>'">
                <div class="slide-counter">${index + 1} / ${images.length}</div>
            </div>
        `).join('');

        let dotsHtml = images.map((_, index) => `
            <button class="dot ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})" aria-label="اسلاید ${index + 1}"></button>
        `).join('');

        container.innerHTML = `
            <div class="gallery-slider">
                <div class="slides" id="slidesContainer">
                    ${slidesHtml}
                </div>
                ${images.length > 1 ? `
                    <button class="slide-nav prev" onclick="changeSlide(-1)" aria-label="قبلی">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                    <button class="slide-nav next" onclick="changeSlide(1)" aria-label="بعدی">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                ` : ''}
                ${images.length > 1 ? `<div class="dots">${dotsHtml}</div>` : ''}
            </div>
        `;

        currentSlide = 0;
        updateSlidePosition();
    }

    window.changeSlide = function(direction) {
        const images = document.querySelectorAll('.gallery-slider .slide');
        if (images.length === 0) return;
        currentSlide = (currentSlide + direction + images.length) % images.length;
        updateSlidePosition();
        updateDots();
    };

    window.goToSlide = function(index) {
        currentSlide = index;
        updateSlidePosition();
        updateDots();
    };

    function updateSlidePosition() {
        const slidesContainer = document.getElementById('slidesContainer');
        if (!slidesContainer) return;
        slidesContainer.style.transform = `translateX(${currentSlide * 100}%)`;
    }

    function updateDots() {
        document.querySelectorAll('.gallery-slider .dot').forEach((dot, index) => {
            dot.classList.toggle('active', index === currentSlide);
        });
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight') changeSlide(-1);
        if (e.key === 'ArrowLeft') changeSlide(1);
    });

    // ========== بارگذاری مکان ==========
    async function loadPlace() {
        try {
            const response = await fetch(`/api/places/public/${placeId}`);
            if (response.ok) {
                const place = await response.json();
                displayPlace(place);
                loadReviews();
            } else {
                document.getElementById('loading').innerHTML = `
                    <div class="text-center py-16">
                        <i class="fas fa-exclamation-triangle text-4xl text-persian-saffron/30 mb-4 block"></i>
                        <p class="text-persian-cream/40">مکان مورد نظر یافت نشد</p>
                    </div>
                `;
            }
        } catch (error) {
            console.error('Error loading place:', error);
            document.getElementById('loading').innerHTML = `
                <div class="text-center py-16">
                    <i class="fas fa-wifi-slash text-4xl text-persian-saffron/30 mb-4 block"></i>
                    <p class="text-persian-cream/40">خطا در ارتباط با سرور</p>
                </div>
            `;
        }
    }

    // ========== نمایش مکان ==========
    function displayPlace(place) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('placeContent').style.display = 'block';

        likeCount = place.likeCount || 0;

        const isApproved = place.status === 'APPROVED';
        const statusBadge = isApproved
            ? '<span class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full"><i class="fas fa-check-circle ml-1"></i> تایید شده</span>'
            : '<span class="bg-persian-gold/10 border border-persian-gold/20 text-persian-gold text-xs px-3 py-1 rounded-full"><i class="fas fa-clock ml-1"></i> در انتظار تایید</span>';

        const galleryContainer = document.getElementById('galleryContainer') || document.createElement('div');
        galleryContainer.id = 'galleryContainer';

        let mapHtml = '';
        if (place.latitude && place.longitude) {
            mapHtml = `
                <div class="mt-6">
                    <h4 class="text-persian-cream/60 text-sm font-medium mb-3">
                        <i class="fas fa-map-location-dot text-persian-gold ml-1"></i>
                        موقعیت مکانی
                    </h4>
                    <div id="map"></div>
                </div>
            `;
            setTimeout(() => initMap(place.latitude, place.longitude, place.name), 300);
        } else if (place.googleMapsLink) {
            mapHtml = `
                <div class="mt-6 text-center">
                    <a href="${place.googleMapsLink}" target="_blank" class="inline-flex items-center gap-2 text-persian-gold/60 hover:text-persian-gold transition-colors border border-persian-gold/20 hover:border-persian-gold/40 px-6 py-3 rounded-2xl">
                        <i class="fas fa-map-location-dot"></i>
                        مشاهده در گوگل مپ
                        <i class="fas fa-arrow-left text-xs"></i>
                    </a>
                </div>
            `;
        }

        document.getElementById('placeContent').innerHTML = `
            <div class="glass-card rounded-2xl p-4 md:p-6 mb-6" id="galleryWrapper">
                <div id="galleryContainer"></div>
            </div>

            <div class="glass-card rounded-2xl p-6 md:p-8 mb-6">
                <div class="flex flex-wrap items-start justify-between gap-4 mb-4">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold text-persian-cream">${escapeHtml(place.name)}</h1>
                        <div class="flex items-center gap-3 mt-2 flex-wrap">
                            <div class="flex items-center gap-1 text-persian-cream/40 text-sm">
                                <i class="fas fa-user ml-1"></i>
                                ${escapeHtml(place.introducerUsername)}
                            </div>
                            ${statusBadge}
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="text-center">
                            <div class="text-2xl font-bold text-persian-gold">${place.averageRating?.toFixed(1) || '۰'}</div>
                            <div class="text-persian-cream/30 text-xs">امتیاز</div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-1 mb-4">
                    ${displayStars(place.averageRating)}
                </div>

                <p class="text-persian-cream/70 leading-relaxed text-sm md:text-base">${escapeHtml(place.description)}</p>

                <div class="flex flex-wrap items-center gap-6 mt-6 pt-5 border-t border-persian-gold/5">
                    <div class="flex items-center gap-2 text-persian-cream/30 text-sm">
                        <i class="fas fa-eye"></i>
                        <span>${place.viewCount || 0} بازدید</span>
                    </div>
                    <div class="flex items-center gap-2 text-persian-cream/30 text-sm">
                        <i class="fas fa-heart text-rose-400/40"></i>
                        <span id="likeCount">${likeCount} لایک</span>
                    </div>
                    <div class="flex items-center gap-2 text-persian-cream/30 text-sm">
                        <i class="fas fa-comment"></i>
                        <span id="reviewCount">۰ نظر</span>
                    </div>
                </div>

                ${token ? `
                    <div class="flex flex-wrap gap-3 mt-5">
                        <button id="likeBtn" class="btn-secondary flex items-center gap-2 ${isLiked ? 'liked' : ''}" ${isLiked ? 'disabled' : ''}>
                            <i class="fas fa-heart"></i>
                            ${isLiked ? 'لایک شده' : 'لایک کردن'}
                        </button>
                    </div>
                ` : `
                    <div class="mt-5 text-persian-cream/30 text-sm">
                        <i class="fas fa-info-circle ml-1"></i>
                        برای لایک کردن <a href="/login" class="text-persian-gold hover:underline">وارد شوید</a>
                    </div>
                `}
            </div>

            ${mapHtml}

            <div class="glass-card rounded-2xl p-6 md:p-8 mt-6">
                <h3 class="text-xl font-bold text-persian-cream mb-6 flex items-center gap-3">
                    <i class="fas fa-comments text-persian-gold"></i>
                    نظرات کاربران
                    <span id="reviewCountBadge" class="text-sm text-persian-cream/30 font-normal"></span>
                </h3>
                <div id="reviewsContainer">
                    <div class="text-center py-8 text-persian-cream/30">
                        <i class="fas fa-spinner fa-spin text-2xl mb-2 block"></i>
                        در حال بارگذاری نظرات...
                    </div>
                </div>
            </div>

            ${token ? `
                <div class="glass-card rounded-2xl p-6 md:p-8 mt-6">
                    <h3 class="text-xl font-bold text-persian-cream mb-4 flex items-center gap-3">
                        <i class="fas fa-pen-fancy text-persian-gold"></i>
                        ثبت نظر جدید
                    </h3>
                    <div id="reviewAlert" class="hidden"></div>
                    <form id="reviewForm" class="space-y-4">
                        <div>
                            <label class="block text-persian-cream/60 text-sm font-medium mb-1.5">
                                <i class="fas fa-star text-persian-gold ml-1"></i>
                                امتیاز شما
                            </label>
                            <select id="rating" required class="glass-select">
                                <option value="">انتخاب کنید</option>
                                <option value="5">⭐⭐⭐⭐⭐ - عالی</option>
                                <option value="4">⭐⭐⭐⭐ - خوب</option>
                                <option value="3">⭐⭐⭐ - متوسط</option>
                                <option value="2">⭐⭐ - ضعیف</option>
                                <option value="1">⭐ - خیلی ضعیف</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-persian-cream/60 text-sm font-medium mb-1.5">
                                <i class="fas fa-align-right text-persian-gold ml-1"></i>
                                نظر شما
                            </label>
                            <textarea id="comment" class="glass-input glass-textarea" rows="3" placeholder="نظر خود را در مورد این مکان بنویسید..."></textarea>
                        </div>
                        <button type="submit" class="btn-primary flex items-center gap-2">
                            <i class="fas fa-paper-plane"></i>
                            ثبت نظر
                        </button>
                    </form>
                </div>
            ` : `
                <div class="glass-card rounded-2xl p-6 md:p-8 mt-6 text-center">
                    <p class="text-persian-cream/30 text-sm">
                        <i class="fas fa-info-circle ml-1"></i>
                        برای ثبت نظر <a href="/login" class="text-persian-gold hover:underline">وارد شوید</a>
                    </p>
                </div>
            `}
        `;

        initGallery(place.photoUrls || [], 'galleryContainer');

        // ===== راه‌اندازی فرم ثبت نظر =====
        initReviewForm();

        // ===== دکمه لایک =====
        if (token) {
            const likeBtn = document.getElementById('likeBtn');
            checkLikeStatus();

            likeBtn?.addEventListener('click', async function () {
                if (this.disabled) return;
                if (isLiked) {
                    showToast('شما قبلاً این مکان را لایک کرده‌اید', 'info');
                    return;
                }

                this.disabled = true;
                const originalText = this.innerHTML;
                this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال ثبت...';

                try {
                    const response = await fetch(`/api/places/${placeId}/like`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (response.ok) {
                        isLiked = true;
                        likeCount++;
                        this.classList.add('liked');
                        this.innerHTML = '<i class="fas fa-heart"></i> لایک شده';
                        this.disabled = true;
                        document.getElementById('likeCount').textContent = `${likeCount} لایک`;
                        showToast('❤️ لایک شد!', 'success');
                    } else if (response.status === 401) {
                        deleteCookie('token');
                        window.location.href = '/login';
                    } else if (response.status === 409) {
                        isLiked = true;
                        this.classList.add('liked');
                        this.innerHTML = '<i class="fas fa-heart"></i> لایک شده';
                        this.disabled = true;
                        showToast('شما قبلاً این مکان را لایک کرده‌اید', 'info');
                    } else {
                        const error = await response.text();
                        showToast(error || 'خطا در لایک کردن', 'error');
                        this.disabled = false;
                        this.innerHTML = originalText;
                    }
                } catch (error) {
                    showToast('خطا در ارتباط با سرور', 'error');
                    this.disabled = false;
                    this.innerHTML = originalText;
                }
            });
        }
    }

    // ========== بررسی وضعیت لایک ==========
    async function checkLikeStatus() {
        if (!token) return;

        try {
            const response = await fetch(`/api/places/${placeId}/like-status`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.ok) {
                const data = await response.json();
                isLiked = data.liked || false;

                const likeBtn = document.getElementById('likeBtn');
                if (likeBtn && isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '<i class="fas fa-heart"></i> لایک شده';
                    likeBtn.disabled = true;
                }
            }
        } catch (error) {
            console.error('Error checking like status:', error);
        }
    }

    // ========== نقشه ==========
    function initMap(lat, lng, name) {
        if (map) map.remove();
        map = L.map('map').setView([lat, lng], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);
        L.marker([lat, lng]).addTo(map)
            .bindPopup(`<b>${escapeHtml(name)}</b>`)
            .openPopup();
    }

    // ========== بارگذاری نظرات ==========
    async function loadReviews() {
        try {
            const response = await fetch(`/api/reviews/place/${placeId}`);
            if (response.ok) {
                const reviews = await response.json();
                const container = document.getElementById('reviewsContainer');
                const countBadge = document.getElementById('reviewCountBadge');
                const countSpan = document.getElementById('reviewCount');

                if (!reviews || reviews.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-8 text-persian-cream/30 text-sm">
                            <i class="fas fa-comment-slash text-2xl block mb-2 text-persian-cream/10"></i>
                            هنوز نظری ثبت نشده است
                        </div>
                    `;
                    if (countBadge) countBadge.textContent = '(۰)';
                    if (countSpan) countSpan.textContent = '۰ نظر';
                    return;
                }

                if (countBadge) countBadge.textContent = `(${reviews.length})`;
                if (countSpan) countSpan.textContent = `${reviews.length} نظر`;

                container.innerHTML = reviews.map(r => `
                    <div class="review-card">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-full bg-persian-gold/10 flex items-center justify-center text-persian-gold text-sm font-bold">
                                    ${escapeHtml((r.username || 'کاربر')[0])}
                                </div>
                                <span class="text-persian-cream/70 font-medium text-sm">${escapeHtml(r.username || 'کاربر مهمان')}</span>
                            </div>
                            <span class="text-persian-cream/20 text-xs">${formatDate(r.createdAt)}</span>
                        </div>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-persian-cream/20 text-xs">امتیاز:</span>
                            <span class="text-persian-gold text-sm">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                        </div>
                        ${r.comment ? `<p class="text-persian-cream/50 text-sm leading-relaxed">${escapeHtml(r.comment)}</p>` : ''}
                    </div>
                `).join('');
            }
        } catch (error) {
            console.error('Error loading reviews:', error);
        }
    }

    // ========== نمایش پیام‌ها در reviewAlert ==========
    function showReviewAlert(message, type) {
        const alert = document.getElementById('reviewAlert');
        if (!alert) {
            console.warn('Review alert element not found');
            return;
        }

        // پاک کردن کلاس‌های قبلی
        alert.className = '';
        alert.style.display = 'none';

        // تنظیم آیکون مناسب
        const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';

        // تنظیم پیام و کلاس‌ها
        alert.innerHTML = `<i class="fas ${icon} ml-2"></i> ${message}`;
        alert.className = `p-3 rounded-2xl text-sm flex items-center gap-2 mb-4 ${
            type === 'success'
                ? 'bg-emerald-500/10 border border-emerald-500/20 text-emerald-400'
                : 'bg-rose-500/10 border border-rose-500/20 text-rose-400'
        }`;
        alert.style.display = 'flex';

        // بعد از 5 ثانیه مخفی شود
        clearTimeout(alert._timeout);
        alert._timeout = setTimeout(() => {
            alert.style.display = 'none';
        }, 5000);
    }

    // ========== نمایش Toast ==========
    function showToast(message, type) {
        const colors = {
            success: 'bg-emerald-500/20 border-emerald-500/30 text-emerald-400',
            error: 'bg-rose-500/20 border-rose-500/30 text-rose-400',
            info: 'bg-sky-500/20 border-sky-500/30 text-sky-400'
        };

        const toast = document.createElement('div');
        toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-2xl backdrop-blur-xl border ${colors[type] || colors.info} text-sm font-medium transition-all duration-500 transform translate-y-20 opacity-0`;
        toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'} ml-2"></i> ${message}`;
        document.body.appendChild(toast);

        setTimeout(() => {
            toast.classList.remove('translate-y-20', 'opacity-0');
        }, 10);

        setTimeout(() => {
            toast.classList.add('translate-y-20', 'opacity-0');
            setTimeout(() => toast.remove(), 500);
        }, 3500);
    }

    // ========== ثبت نظر ==========
    function initReviewForm() {
        const reviewForm = document.getElementById('reviewForm');
        if (!reviewForm) {
            console.warn('Review form not found');
            return;
        }

        // حذف event listener قبلی با clone
        const newForm = reviewForm.cloneNode(true);
        reviewForm.parentNode.replaceChild(newForm, reviewForm);

        newForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            e.stopPropagation();

            const rating = document.getElementById('rating').value;
            const comment = document.getElementById('comment').value;

            if (!rating) {
                showReviewAlert('⚠️ لطفاً امتیاز را انتخاب کنید', 'error');
                return;
            }

            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال ثبت...';

            try {
                const token = getCookie('token');
                if (!token) {
                    showReviewAlert('⚠️ لطفاً برای ثبت نظر وارد شوید', 'error');
                    window.location.href = '/login';
                    return;
                }

                console.log('Sending review for place:', placeId);
                console.log('Rating:', rating);
                console.log('Comment:', comment);

                const response = await fetch('/api/reviews/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        placeId: parseInt(placeId),
                        rating: parseInt(rating),
                        comment: comment || ''
                    })
                });

                console.log('Response status:', response.status);
                const responseText = await response.text();
                console.log('Response text:', responseText);

                if (response.ok) {
                    showReviewAlert('✅ نظر شما با موفقیت ثبت شد! پس از تایید ادمین در سایت نمایش داده می‌شود.', 'success');
                    this.reset();
                    setTimeout(() => loadReviews(), 1500);
                } else if (response.status === 401) {
                    deleteCookie('token');
                    window.location.href = '/login';
                } else if (response.status === 400) {
                    // بررسی خطای تکراری بودن نظر
                    if (responseText.includes('قبلاً') || responseText.includes('already')) {
                        showReviewAlert('⚠️ شما قبلاً برای این مکان نظر داده‌اید!', 'error');
                    } else {
                        showReviewAlert('⚠️ ' + (responseText || 'خطا در ثبت نظر'), 'error');
                    }
                } else {
                    showReviewAlert('⚠️ ' + (responseText || 'خطا در ثبت نظر'), 'error');
                }
            } catch (error) {
                console.error('Error submitting review:', error);
                showReviewAlert('⚠️ خطا در ارتباط با سرور', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });
    }

    // ========== بارگذاری اولیه ==========
    document.addEventListener('DOMContentLoaded', function () {
        loadPlace();
        setTimeout(initReviewForm, 500);
    });
</script>
