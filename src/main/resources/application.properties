spring.application.name=Naghshe-Gard
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/naghshegard}
spring.datasource.username=${DATABASE_USERNAME:naghshegard}
spring.datasource.password=${DATABASE_PASSWORD:naghshegard}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.main.allow-circular-references=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
jwt.secret=${JWT_SECRET:change-this-development-secret-before-production-1234567890}
jwt.expiration=${JWT_EXPIRATION:864000000}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.security.oauth2.resourceserver.jwt.secret-key=${jwt.secret}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
verification.code.expiration=${VERIFICATION_CODE_EXPIRATION:10}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
